[project]
name = "buildwise-api"
version = "0.0.0"
description = "BuildWise AI backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pgserver>=0.1.4",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildwise_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"migrations/versions/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pgserver"]
ignore_missing_imports = true
