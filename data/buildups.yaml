# Surface build-ups ("sandwiches"): the ordered layers of a floor or wall,
# bottom to top, with the material each layer uses. These are the proposals
# shown when a person clicks a surface in the demo house. They are grounded in
# the manufacturer data in catalog/, cited by page where a product is named.
#
# roles (a small controlled set, labelled in the app):
#   structure substrate underlayment membrane drain mortar covering grout finish
#
# quantity: how much of the layer's material one surface needs.
#   per:    area (per m² of the surface) | perimeter (per metre of the room's
#           floor/wall joint) | each (a fixed count per surface)
#   amount: the rate (per m², per m or a count)
#   unit:   kg | m2 | m | L | pcs
#   waste:  extra fraction for cuts and overlaps (0.10 = +10 %)
#   basis:  manufacturer (rate from a cited document) | geometry (the surface
#           itself) | estimate (common practice, to be replaced by
#           manufacturer data)
#   package: optional sale unit, e.g. a 22.68 kg bag or a 3.78 L pail, to count
#           packages (kind: bag | roll | box | pail | can)
#   search: the query opened in the retailers' own search
#
# Mortar rates come from the DITRA handbook, page 19: one 50 lb (22.68 kg) bag
# bonds 150 ft² (10.7 m²) of DITRA, and sets 40-50 ft² (3.7-4.6 m²) of tile on
# DITRA; the conservative end (3.7 m²) is used.
#
# RedGard, sell sheet page 2: one 1 gal (3.78 L) pail covers 55 ft² (5.1 m²)
# as a waterproof membrane, so 3.78 / 5.1 = 0.74 L per m².
# Aura Bath & Spa, TDS page 1: 3.79 L covers 32.5-37.2 m² per coat and bare
# substrates need two coats; the conservative end gives 2 x 3.79 / 32.5 =
# 0.23 L per m².
# CGC handbook chapter 3, page 3: finishing 100 m² of gypsum panels takes
# 113 m of joint tape and 36 L of lightweight all-purpose ready-mixed compound
# (sold in 17 L pails, CGC finishings catalogue page 7; tape in 76.2 m rolls,
# page 10), and
# single-layer walls on 400 mm framing take about 1,000 screws; that is 1.13 m,
# 0.36 L and 10 screws per m². Gypsum panels are 1220 x 2440 mm (handbook
# chapter 1, page 9), 2.97 m² a sheet; Durock boards 915 x 1524 mm, 1.39 m².
# Regal Select, TDS page 1: 37.1 m² per 3.79 L, new drywall takes two coats,
# so 2 x 3.79 / 37.1 = 0.21 L per m². Ceilings need screws every 300 mm (page 11),
# so their count is an estimate. Durock screws are spaced 200 mm on walls and
# floors (chapter 4, page 3); the handbook gives no count, so it is an estimate.

