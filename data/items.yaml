# Everything in the example house a person can click: furniture, fixtures,
# appliances, doors, windows and their hardware. The 3D model tags each object
# with one of these ids (tools/house-model/build_house.py), and the app opens
# the retailers' own search with `search` (no prices or stock are stored here).
#
# What the builder hands over: no loose furniture. The app is for building and
# renovating, so only the house's structure, finishes and systems are items.
#
# category: cabinetry | plumbing | electrical | lighting | heating |
#           ventilation | door | window | hardware | trim
# measure:  each (counted, the default) | length (metres, e.g. baseboard)
# summary:  what to check before buying, in one sentence

items:
  - id: base_cabinet
    name: "Kitchen base cabinet"
    category: cabinetry
    measure: length
    summary: "Base cabinets come in standard widths: plan the run around the sink and the appliances first."
    search: "kitchen base cabinet"
  - id: wall_cabinet
    name: "Kitchen wall cabinet"
    category: cabinetry
    measure: length
    summary: "Screw it to the studs, never only into the drywall."
    search: "kitchen wall cabinet"
  - id: countertop
    name: "Countertop"
    category: cabinetry
    measure: length
    summary: "Order it once the base cabinets are installed and level, with the cut-outs for the sink and the cooktop."
    search: "kitchen countertop"
  - id: kitchen_sink
    name: "Kitchen sink"
    category: plumbing
    summary: "Check the smallest cabinet it fits and whether it mounts under or on top of the counter."
    search: "kitchen sink"
  - id: kitchen_faucet
    name: "Kitchen faucet"
    category: plumbing
    summary: "Match the number of holes in the sink or the counter."
    search: "kitchen faucet"
  - id: range_hood
    name: "Range hood"
    category: ventilation
    summary: "A hood ducted to the outside works best; make it at least as wide as the cooktop."
    search: "range hood"
  - id: cabinet_pull
    name: "Cabinet pull"
    category: hardware
    summary: "When replacing pulls, match the hole spacing, centre to centre."
    search: "cabinet pull"
  - id: bathroom_vanity
    name: "Bathroom vanity"
    category: cabinetry
    summary: "Check the water and drain positions in the wall against the open back of the cabinet."
    search: "bathroom vanity"
  - id: vanity_top
    name: "Vanity top with sink"
    category: plumbing
    summary: "Match the top to the cabinet width and its faucet holes to the faucet."
    search: "vanity top"
  - id: bathroom_faucet
    name: "Bathroom faucet"
    category: plumbing
    summary: "Single-hole or widespread: match the holes in the vanity top."
    search: "bathroom faucet"
  - id: bathroom_mirror
    name: "Bathroom mirror"
    category: hardware
    summary: "Pick one no wider than the vanity and fix it to studs or rated anchors."
    search: "bathroom mirror"
  - id: toilet
    name: "Toilet"
    category: plumbing
    summary: "Before buying, measure the rough-in: from the finished wall to the centre of the floor drain."
    search: "toilet"
  - id: shower_glass_panel
    name: "Shower glass panel"
    category: plumbing
    summary: "Use tempered safety glass; a fixed panel mounts in a floor channel with a wall bracket."
    search: "shower glass panel"
  - id: shower_valve
    name: "Shower valve"
    category: plumbing
    summary: "Buy the valve body and its trim from the same brand; a pressure-balancing valve keeps the temperature steady."
    search: "shower valve"
  - id: rain_shower_head
    name: "Rain shower head"
    category: plumbing
    summary: "Check that the arm and the thread match the valve's outlet."
    search: "rain shower head"
  - id: linear_drain
    name: "Linear shower drain"
    category: plumbing
    summary: "The drain must belong to the waterproofing system used on the shower floor."
    search: "linear shower drain"
  - id: towel_bar
    name: "Towel bar"
    category: hardware
    summary: "Fix it into studs or with anchors rated for pulling loads."
    search: "towel bar"
  - id: interior_door
    name: "Prehung interior door"
    category: door
    summary: "Measure the rough opening and the wall thickness, and choose the hand from the side it opens toward."
    search: "prehung interior door"
  - id: entry_door
    name: "Exterior entry door"
    category: door
    summary: "Choose an insulated steel or fibreglass door with weatherstripping; measure the rough opening and choose the hand."
    search: "exterior door"
  - id: door_lever
    name: "Door lever"
    category: hardware
    summary: "Passage for halls; privacy, with a lock, for bathrooms and bedrooms."
    search: "door lever"
  - id: entry_handleset
    name: "Entry door handleset"
    category: hardware
    summary: "Pair it with a deadbolt and check the door's bore hole and backset."
    search: "entry door handleset"
  - id: window
    name: "Window"
    category: window
    summary: "Order by the rough opening; a bedroom needs a window that opens wide enough to get out through."
    search: "window"
  - id: window_sill
    name: "Window sill"
    category: window
    summary: "Buy the board deeper than the wall so it overhangs the trim."
    search: "window stool moulding"
  - id: door_casing
    name: "Door casing"
    category: door
    summary: "Measure both sides of the opening; casing is sold in lengths to cut at 45°."
    search: "door casing moulding"
  - id: duplex_receptacle
    name: "Duplex receptacle"
    category: electrical
    summary: "Match the circuit's amperage (15 A or 20 A) and choose tamper-resistant receptacles."
    search: "tamper resistant receptacle"
  - id: gfci_receptacle
    name: "GFCI receptacle"
    category: electrical
    summary: "Near a sink, a ground-fault receptacle protects against shocks, and also protects the receptacles wired after it."
    search: "gfci receptacle"
  - id: light_switch
    name: "Light switch"
    category: electrical
    summary: "Use a 3-way switch where a light is controlled from two places; a dimmer needs dimmable bulbs."
    search: "light switch"
  - id: thermostat
    name: "Line-voltage thermostat"
    category: heating
    summary: "An electric baseboard needs a line-voltage thermostat rated for the heater's wattage."
    search: "line voltage thermostat"
  - id: baseboard_heater
    name: "Electric baseboard heater"
    category: heating
    summary: "Size it to the room's heat loss, not only its area, and keep it clear of curtains."
    search: "electric baseboard heater"
  - id: electrical_panel
    name: "Electrical panel"
    category: electrical
    summary: "Only a licensed electrician may install or change it; plan spare spaces for future circuits."
    search: "electrical panel"
  - id: ceiling_light
    name: "Ceiling light fixture"
    category: lighting
    summary: "Check the fixture's weight against the electrical box, and choose the colour temperature of the light."
    search: "ceiling light fixture"
  - id: smoke_co_alarm
    name: "Smoke and CO alarm"
    category: electrical
    summary: "Hard-wired, interconnected alarms sound together; a combined unit also detects carbon monoxide."
    search: "smoke carbon monoxide alarm"
  - id: bathroom_exhaust_fan
    name: "Bathroom exhaust fan"
    category: ventilation
    summary: "In Quebec it must move at least 25 L/s (53 cfm) through its duct, be switched by hand in the room and be no louder than 3.5 sones (HVI); duct it to the outside, never into the attic."
    search: "bathroom exhaust fan"
    slot: bathroom-fan
  - id: insulated_flex_duct_3
    name: "Insulated flexible duct, 3 in"
    category: ventilation
    measure: length
    summary: "Through an unheated attic the duct must be insulated to RSI 0.74 (R-4.2) at least; keep it short and stretched, and support it so it cannot sag."
    search: "insulated flexible duct 3 in"
  - id: exhaust_wall_cap_3
    name: "Exhaust wall cap, 3 in"
    category: ventilation
    summary: "The outlet needs a backdraft damper and must sit at least 100 mm above the ground and 1.8 m from air intakes and vented soffits."
    search: "exhaust wall cap 3 in damper"
  - id: insulated_flex_duct_4
    name: "Insulated flexible duct, 4 in"
    category: ventilation
    measure: length
    summary: "Through an unheated attic the duct must be insulated to RSI 0.74 (R-4.2) at least; keep it short and stretched, and support it so it cannot sag."
    search: "insulated flexible duct 4 in"
  - id: exhaust_wall_cap_4
    name: "Exhaust wall cap, 4 in"
    category: ventilation
    summary: "The outlet needs a backdraft damper and must sit at least 100 mm above the ground and 1.8 m from air intakes and vented soffits."
    search: "exhaust wall cap 4 in damper"
  - id: insulated_flex_duct_6
    name: "Insulated flexible duct, 6 in"
    category: ventilation
    measure: length
    summary: "Through an unheated attic the duct must be insulated to RSI 0.74 (R-4.2) at least; keep it short and stretched, and support it so it cannot sag."
    search: "insulated flexible duct 6 in"
  - id: exhaust_wall_cap_6
    name: "Exhaust wall cap, 6 in"
    category: ventilation
    summary: "The outlet needs a backdraft damper and must sit at least 100 mm above the ground and 1.8 m from air intakes and vented soffits."
    search: "exhaust wall cap 6 in damper"
  - id: foil_duct_tape
    name: "Foil duct tape"
    category: ventilation
    summary: "Duct joints must be sealed with mastic, metal foil duct tape or the manufacturer's sealant; cloth duct tape does not qualify."
    search: "foil duct tape"
  - id: duct_clamp
    name: "Duct clamp"
    category: ventilation
    summary: "One at each end holds the flexible duct tight on the fan collar and on the wall cap."
    search: "duct clamp"
  - id: exterior_light
    name: "Exterior entrance light"
    category: lighting
    summary: "Every entrance needs an outdoor light controlled by a wall switch inside; choose a fixture rated for wet locations."
    search: "exterior wall light"
  - id: baseboard
    name: "Baseboard"
    category: trim
    measure: length
    summary: "Buy a little more than the measured length to allow for the corner cuts."
    search: "baseboard moulding"
  - id: pex_pipe_3_4
    name: "PEX pipe, 3/4 in"
    category: plumbing
    measure: length
    summary: "Red for hot and blue for cold water make the runs easy to trace; support it every 0.8 m when it runs horizontally."
    search: "PEX pipe 3/4"
    slot: pex-pipe
  - id: pex_pipe_1_2
    name: "PEX pipe, 1/2 in"
    category: plumbing
    measure: length
    summary: "Buy the same PEX type (A, B or C) as the fittings and tools you will use."
    search: "PEX pipe 1/2"
    slot: pex-pipe
  - id: pex_elbow_3_4
    name: "PEX elbow, 3/4 in"
    category: plumbing
    summary: "Match the fitting system (crimp, clamp or expansion) to your tool."
    search: "PEX elbow 3/4"
  - id: pex_elbow_1_2
    name: "PEX elbow, 1/2 in"
    category: plumbing
    summary: "Match the fitting system (crimp, clamp or expansion) to your tool."
    search: "PEX elbow 1/2"
  - id: pex_tee
    name: "PEX tee"
    category: plumbing
    summary: "Where a 1/2 in branch leaves a 3/4 in line, buy a reducing tee."
    search: "PEX tee 3/4 x 1/2"
  - id: pex_crimp_ring
    name: "PEX crimp ring"
    category: plumbing
    summary: "One ring per pipe end in each fitting; buy rings in both sizes, 1/2 in and 3/4 in."
    search: "PEX crimp ring"
  - id: pex_expansion_ring
    name: "ProPEX expansion ring"
    category: plumbing
    summary: "PEX-a pipe such as Uponor AquaPEX is joined by expanding the pipe end with a ring over it; one ring per pipe end, in the pipe's size."
    search: "Uponor ProPEX ring"
  - id: pex_pipe_clip
    name: "PEX pipe clip"
    category: plumbing
    summary: "Clips must hold the pipe without pinching or cutting it."
    search: "PEX pipe clip"
  - id: pex_stub_elbow
    name: "PEX drop-ear elbow"
    category: plumbing
    summary: "Screwed to blocking, it holds the stub-out firmly where the shut-off valve will go."
    search: "PEX drop ear elbow"
  - id: abs_pipe_3
    name: "ABS pipe, 3 in"
    category: plumbing
    measure: length
    summary: "A water closet drains through 3 in pipe at least; support horizontal runs every 1.2 m."
    search: "ABS pipe 3"
    slot: abs-pipe
  - id: abs_pipe_2
    name: "ABS pipe, 2 in"
    category: plumbing
    measure: length
    summary: "A shower discharging 9.5 to 20 L/min needs at least a 2 in outlet pipe."
    search: "ABS pipe 2"
    slot: abs-pipe
  - id: abs_pipe_1_1_2
    name: "ABS pipe, 1-1/2 in"
    category: plumbing
    measure: length
    summary: "For the lavatory drain and the vent; the code allows 1-1/4 in at least for a lavatory."
    search: "ABS pipe 1 1/2"
    slot: abs-pipe
  - id: abs_elbow_3
    name: "ABS elbow, 3 in"
    category: plumbing
    summary: "Use long-sweep bends where the flow changes from vertical to horizontal."
    search: "ABS elbow 3"
  - id: abs_elbow_2
    name: "ABS elbow, 2 in"
    category: plumbing
    summary: "Use long-sweep bends where the flow changes from vertical to horizontal."
    search: "ABS elbow 2"
  - id: abs_elbow_1_1_2
    name: "ABS elbow, 1-1/2 in"
    category: plumbing
    summary: "Use long-sweep bends where the flow changes from vertical to horizontal."
    search: "ABS elbow 1 1/2"
  - id: abs_sanitary_tee
    name: "ABS sanitary tee"
    category: plumbing
    summary: "Match the run and branch sizes, and point the sweep in the direction of flow."
    search: "ABS sanitary tee"
  - id: abs_pipe_hanger
    name: "ABS pipe hanger"
    category: plumbing
    summary: "Hangers must not compress, cut or abrade the pipe; add one at each change of direction."
    search: "ABS pipe hanger"
  - id: shutoff_valve
    name: "Shut-off valve"
    category: plumbing
    summary: "Quarter-turn valves let you close each fixture without shutting off the house."
    search: "quarter turn shut off valve"
  - id: faucet_supply_line
    name: "Braided supply line"
    category: plumbing
    summary: "Measure from the valve to the fixture inlet and check both thread sizes."
    search: "braided faucet supply line"
  - id: p_trap
    name: "P-trap, 1-1/4 in"
    category: plumbing
    summary: "Every fixture needs a trap; a lavatory takes a 1-1/4 in trap."
    search: "P-trap 1 1/4"
  - id: closet_flange
    name: "Toilet flange, 3 in"
    category: plumbing
    summary: "Set its top level with the finished floor, centred at the toilet's rough-in distance from the wall."
    search: "ABS closet flange 3"
  - id: toilet_wax_ring
    name: "Toilet seal with closet bolts"
    category: plumbing
    summary: "Use a thicker or wax-free seal if the flange sits below the finished floor."
    search: "toilet wax ring with bolts"
  - id: abs_cement
    name: "ABS cement"
    category: plumbing
    summary: "Use cement made for ABS; never join ABS and PVC with it unless the can says so."
    search: "ABS cement"
  - id: roof_vent_flashing
    name: "Roof vent flashing"
    category: plumbing
    summary: "Match the boot to the vent pipe size and the roof slope."
    search: "plumbing vent flashing"
  - id: riser_clamp
    name: "Riser clamp"
    category: plumbing
    summary: "A vertical stack rests on a clamp at its base, and again at least every 7.5 m."
    search: "riser clamp 3 inch"
  - id: electrical_box
    name: "Electrical box"
    category: electrical
    summary: "Size the box for the number of wires and devices it holds; use a box rated for the fixture's weight under a ceiling light."
    search: "electrical box"
  - id: nmd90_cable
    name: "NMD90 cable 14/2"
    category: electrical
    measure: length
    summary: "14/2 copper NMD90 suits 15 A lighting and receptacle circuits; heavier loads need 12/2 on a 20 A breaker."
    search: "NMD90 14/2"
    slot: nmd90-cable
