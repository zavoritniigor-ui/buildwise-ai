# Products sold in Canada that can fill a layer of a build-up. A layer names a
# slot; the person picks a product for that slot and the quantities follow the
# product's own data sheet. The first product of a slot is the default and is
# the one the build-up layer itself describes.
#
# Rates, from each manufacturer's data sheet (cited by page):
# - Regal Select K549: 37.1 m² per 3.79 L, two coats on new drywall -> 0.21 L/m²
# - Sico Expert 843, Endurance 746, Virtuo 443: 37 m² per 3.78 L per coat, two
#   coats on new drywall -> 0.21 L/m²
# - Aura Bath & Spa K532: 32.5 m² per 3.79 L, two coats -> 0.23 L/m²
# - Sico Evolution 867 (for bathrooms and kitchens): 45 m² per 3.78 L per coat,
#   two coats -> 0.17 L/m²
# - RedGard: 5.1 m² per 3.78 L as a waterproof membrane -> 0.74 L/m²
# - RedGard SpeedCoat: one coat over cement backer board, 20.4 m² per 3.78 L
#   -> 0.19 L/m²
# - HYDRO BAN: 4.6 m² per 3.8 L -> 0.83 L/m²
# - Tile mortars, 1/4 x 1/4 in (6 x 6 mm) square-notch trowel, the lower end
#   of each range: VersaBond 7.9 m² and VersaBond HP 8.4 m² per 22.68 kg bag
#   -> 2.88 and 2.70 kg/m²; 253 Gold 7.4 m² per 22.7 kg bag -> 3.07 kg/m²;
#   MAPEI Ultraflex 2 6.97 m² and Ultraflex LFT 7.90 m² per 22.7 kg bag
#   -> 3.26 and 2.87 kg/m²
# - Mapelastic AquaDefense: 19.5 m² for two coats per 13.2 L pail -> 0.68 L/m²
# - Grouts, 12 x 12 in (300 x 300 x 10 mm) tile with 1/8 in (3 mm) joints, per
#   25 lb bag: Polyblend Plus 32.3 m² per 11.34 kg -> 0.36 kg/m²; MAPEI
#   Keracolor S 35.6 m², Ultracolor Plus FA 36.0 m² and Keracolor U (unsanded,
#   joints up to 1/8 in) 49.2 m² per 11.3 kg -> 0.32, 0.31 and 0.23 kg/m²

slots:
  interior-paint: { name: Interior paint }
  bathroom-paint: { name: Bathroom paint }
  liquid-waterproofing: { name: Liquid waterproofing membrane }
  tile-mortar: { name: Tile mortar }
  tile-grout: { name: Tile grout }

