    slot: interior-paint
    brand: Benjamin Moore
    name: Regal Select Eggshell
    quantity:
      {
        per: area,
        amount: 0.21,
        unit: L,
        basis: manufacturer,
        source: { document: regal-select-tds, page: 1 },
