categories:
  - slug: sheet-waterproofing-membrane
    name: Sheet-applied waterproofing membrane
  - slug: waterproofing-band
    name: Waterproofing band

rules:
  - slug: sheet-membrane-substrate
    category: sheet-waterproofing-membrane
    kind: membership
    condition: substrate
    material_attribute: allowed_substrates
    description: The membrane may only be bonded to a substrate the manufacturer allows.
    source: { document: kerdi-tds, page: 1 }
    status: ai_extracted
  - slug: sheet-membrane-application
    category: sheet-waterproofing-membrane
    kind: membership
    condition: application
    material_attribute: allowed_applications
    description: The membrane may only be used where the manufacturer allows it.
    source: { document: kerdi-tds, page: 1 }
    status: ai_extracted
  - slug: sheet-membrane-bonding-mortar
    category: sheet-waterproofing-membrane
    kind: membership
    condition: bonding_mortar
    material_attribute: compatible_bonding_mortars
    description: The membrane must be bonded with a mortar the manufacturer names.
    source: { document: kerdi-tds, page: 2 }
    status: ai_extracted
  - slug: sheet-membrane-working-temperature
    category: sheet-waterproofing-membrane
    kind: range
    condition: material_temperature_c
    min_attribute: min_working_temperature_c
    max_attribute: max_working_temperature_c
    description: The membrane must be acclimated within its working temperature range.
    source: { document: kerdi-tds, page: 2 }
    status: ai_extracted

families:
  - name: Schluter-KERDI
    category: sheet-waterproofing-membrane
    attributes:
      - key: allowed_substrates
        value:
          - gypsum_wallboard
          - cement_backer_unit
          - fiber_cement_backerboard
          - fiber_reinforced_gypsum_backerboard
          - coated_glass_mat_gypsum_backerboard
          - portland_cement_mortar
          - masonry
          - concrete
          - cement_leveler_or_mortar_bed
        source: { document: kerdi-tds, page: 1 }
        status: ai_extracted
        note: >-
          Magnesium board (floors only) and Schluter boards, trays and niches are
          also listed with conditions; they are left out until modelled. Some
          substrates may need a primer.
      - key: allowed_applications
        value:
          - interior_wet_area_wall
          - interior_wet_area_floor
          - shower_wall
          - shower_floor
          - shower_ceiling
          - bathtub_surround
          - intermittent_steam_shower
        source: { document: kerdi-tds, page: 1 }
        status: ai_extracted
        note: >-
          Not for primary exterior waterproofing, continuous-use steam rooms,
          moisture-sensitive stone, or hydrostatic pressure.
      - key: compatible_bonding_mortars
        value: [schluter_set, schluter_all_set, schluter_fast_set, unmodified_thinset]
        source: { document: kerdi-tds, page: 2 }
        status: ai_extracted
      - key: min_working_temperature_c
        value: 4
        unit: C
        source: { document: kerdi-tds, page: 2 }
        status: ai_extracted
      - key: max_working_temperature_c
        value: 35
        unit: C
        source: { document: kerdi-tds, page: 2 }
        status: ai_extracted
      - key: thickness
        value: 8
        unit: mil
        source: { document: kerdi-tds, page: 1 }
        status: ai_extracted
      - key: vapor_permeance_astm_e96_e
        value: 0.9
        unit: perm
        source: { document: kerdi-tds, page: 2 }
        status: ai_extracted
      - key: waterproofing_standard
        value: ANSI A118.10-S
        source: { document: kerdi-tds, page: 2 }
        status: ai_extracted
      - key: flood_test_required
        value: "yes"
        source: { document: kerdi-tds, page: 2 }
        status: ai_extracted
