# Facts from Schluter-Systems' own technical data sheet, cited by page.
# See data/README.md for how to review them.

manufacturer:
  name: Schluter-Systems
  website: https://www.schluter.ca

documents:
  - id: kerdi-board-tds
    type: tds
    title: Technical Data Sheet 12.1 Schluter-KERDI-BOARD
    url: https://assets.schluter.com/asset/570120892212/document_ssp6p29ns55s3ak2uaasbp467f/datasheet-kerdiboard.pdf
    version: 10/2026
    pages: 13
    sha256: c893f059d9f4f5a9f8cd427897b3edf92fee8bd7bfd94a5b7b6ce23693082279
    retrieved_on: 2026-11-15

categories:
  - slug: waterproof-building-panel
    name: Waterproof building panel

rules:
  - slug: building-panel-mounting
    category: waterproof-building-panel
    kind: membership
    condition: mounting
    material_attribute: allowed_mountings
    description: >-
      The panel must be thick enough for how it is mounted. Allowed mountings
      are derived from each panel's thickness.
    source: { document: kerdi-board-tds, page: 2 }
    status: ai_extracted
  - slug: building-panel-application
    category: waterproof-building-panel
    kind: membership
    condition: application
    material_attribute: allowed_applications
    description: The panel may only be used where the manufacturer allows it.
    source: { document: kerdi-board-tds, page: 1 }
    status: ai_extracted
  - slug: building-panel-tile-mortar
    category: waterproof-building-panel
    kind: membership
    condition: bonding_mortar
    material_attribute: compatible_bonding_mortars
    description: Tile must be set on the panel with a mortar the manufacturer names.
    source: { document: kerdi-board-tds, page: 2 }
    status: ai_extracted

families:
  - name: Schluter-KERDI-BOARD
    category: waterproof-building-panel
    attributes:
      - key: allowed_applications
        value: [interior_wet_area_wall, shower_wall, shower_ceiling, bathtub_surround]
        source: { document: kerdi-board-tds, page: 1 }
        status: ai_extracted
        note: Not intended for exterior applications. Floors are not listed as a use.
      - key: compatible_bonding_mortars
        value: [schluter_set, schluter_all_set, schluter_fast_set, unmodified_thinset]
        source: { document: kerdi-board-tds, page: 2 }
        status: ai_extracted
