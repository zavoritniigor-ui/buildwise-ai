    name: Prefabricated sloped shower tray
  - slug: prefabricated-shower-ramp
    name: Prefabricated shower ramp

rules:
  - slug: shower-tray-drain-system
    category: prefabricated-shower-tray
    kind: membership
    condition: drain_system
    material_attribute: compatible_drain_systems
    description: >-
      The tray is made for one drain system: T, TS and TT trays take a
      KERDI-DRAIN point drain, LT and LTS trays take a KERDI-LINE linear drain.
    source: { document: shower-data-sheet, page: 2 }
    status: ai_extracted

