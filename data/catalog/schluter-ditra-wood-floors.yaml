    retrieved_on: 2026-11-15

categories: []

assemblies:
  - slug: schluter-d-w16-t
    name: Tile over DITRA on a single-layer wood subfloor, joists at 406 mm (D-W16-T)
    description: >-
      Interior dry or wet floor. DITRA does not replace movement joints; where
      a waterproof floor is needed, seams and floor/wall joints get KERDI-BAND.
    attributes:
      - key: allowed_subfloors
        value: [plywood, osb]
        source: { document: ditra-handbook, page: 4 }
        status: ai_extracted
        note: Exposure 1, plugged-face plywood or OSB is recommended.
      - key: allowed_subfloor_edges
        value: [tongue_and_groove]
        source: { document: ditra-handbook, page: 4 }
        status: ai_extracted
      - key: allowed_joist_types
        value: [dimensional_lumber, engineered_i_joist, open_web_truss]
        source: { document: ditra-handbook, page: 4 }
        status: ai_extracted
      - key: max_joist_spacing_mm
        value: 406
        unit: mm
        source: { document: ditra-handbook, page: 4 }
        status: ai_extracted
      - key: min_subfloor_thickness_mm
        value: 16
        unit: mm
        source: { document: ditra-handbook, page: 4 }
        status: ai_extracted
        note: 19/32 in (5/8 in nominal) tongue-and-groove, 1/8 in (3 mm) gap between sheets.
      - key: allowed_tile_materials
        value: [ceramic, porcelain]
        source: { document: ditra-handbook, page: 4 }
        status: ai_extracted
      - key: min_tile_side_mm
        value: 50
        unit: mm
        source: { document: ditra-handbook, page: 4 }
        status: ai_extracted
        note: Smaller formats need Schluter technical services (page 21).
      - key: allowed_uncoupling_membranes
        value: [ditra, ditra_xl]
        source: { document: ditra-handbook, page: 4 }
        status: ai_extracted
      - key: allowed_membrane_bonding_mortars
        value: [schluter_all_set, schluter_fast_set, modified_thinset]
        source: { document: ditra-handbook, page: 4 }
        status: ai_extracted
        note: Bonds the membrane to the wood.
      - key: allowed_tile_setting_mortars
        value: [schluter_set, schluter_all_set, schluter_fast_set, unmodified_thinset]
        source: { document: ditra-handbook, page: 4 }
        status: ai_extracted
        note: Sets the tile on the membrane.

