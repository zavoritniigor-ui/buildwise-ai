# Tile floor assemblies over wood from the Schluter-DITRA Installation Handbook.
# Only the mortar-bonded details (D-...) are modelled; the peel-and-stick
# DITRA-PS details (DPS-...) use a primer instead and are not modelled yet.
# See data/README.md for how to review them.

manufacturer:
  name: Schluter-Systems
  brand: Schluter
  website: https://www.schluter.ca

documents:
  - id: ditra-handbook
    type: installation_manual
    title: Schluter-DITRA Installation Handbook
    url: https://assets.schluter.com/asset/570120892212/document_943vbnqrgt3ol0fc95n9ofe057/ditra-installation-handbook.pdf
    version: 04/2026
    pages: 32
