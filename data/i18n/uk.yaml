  "The panel may only be used where the manufacturer allows it.": "Плиту можна застосовувати лише там, де дозволяє виробник."
  "The panel must be thick enough for how it is mounted. Allowed mountings are derived from each panel's thickness.": "Плита має бути достатньо товстою для способу монтажу. Дозволені способи визначено з товщини кожної плити."
