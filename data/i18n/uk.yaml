  "Engineered I-joist": "Двотаврова клеєна балка"
  "Except the neo-angle KST965NA/BF, whose drain is off-center.": "Крім кутового KST965NA/BF, у якого трап зміщений від центру."
  "Expanded polystyrene, 60 kg/m3, measured at 10 % deformation. Keep away from hydrocarbons, esters, amines, aldehydes and long UV exposure.": "Пінополістирол 60 кг/м³, виміряно при деформації 10 %. Берегти від вуглеводнів, естерів, амінів, альдегідів і тривалого ультрафіолету."
  "Exposure 1, plugged-face plywood or OSB is recommended.": "Рекомендовано фанеру Exposure 1 з виправленою лицьовою стороною або OSB."
  "Exposure 1, plugged-face plywood or OSB, 1/8 in (3 mm) gaps; installed per page 18.": "Фанера Exposure 1 з виправленою лицьовою стороною або OSB, зазори 3 мм (1/8 дюйма); монтаж за с. 18."
