  "Gypsum wallboard": "Гіпсокартон"
  "Hangers must not compress, cut or abrade the pipe; add one at each change of direction.": "Підвіс не має перетискати, різати чи стирати трубу; ставте його й на кожному повороті."
  "Hard-wired, interconnected alarms sound together; a combined unit also detects carbon monoxide.": "Дротові з'єднані між собою датчики спрацьовують разом; комбінований датчик виявляє й чадний газ."
  "Height compensation board": "Плита для вирівнювання висоти"
