  "The drain outlet must match the waste pipe size.": "Вихід трапа має відповідати діаметру труби."
  "The drawing legend lists joists, I-joists or trusses; the requirements text names only I-joists or floor trusses. The less restrictive reading is used.": "У підписах креслення названо лаги, двотаврові балки чи ферми, а в тексті вимог — лише двотаврові балки та ферми. Взято менш суворе прочитання."
  "The included foam channel support sets the drain elevation to the LT and LTS trays.": "Пінопластова опора каналу в комплекті виставляє висоту трапа під піддони LT і LTS."
