texts:
  "19/32 in (5/8 in nominal) tongue-and-groove, 1/8 in (3 mm) gap between sheets.": "19/32 дюйма (номінально 5/8 дюйма), шпунт-паз, зазор 3 мм (1/8 дюйма) між листами."
