# Ukrainian translations of the English texts in data/.
# The English text is the source; a changed source needs a new translation.

texts:
  "14/2 copper NMD90 suits 15 A lighting and receptacle circuits; heavier loads need 12/2 on a 20 A breaker.": "Мідний NMD90 14/2 підходить для ліній освітлення й розеток на 15 А; для більших навантажень потрібен 12/2 на автоматі 20 А."
  "19/32 in (5/8 in nominal) tongue-and-groove, 1/8 in (3 mm) gap between sheets.": "19/32 дюйма (номінально 5/8 дюйма), шпунт-паз, зазор 3 мм (1/8 дюйма) між листами."
  "2 in (50 mm) waste pipe": "Каналізаційна труба 50 мм (2 дюйми)"
  "2 in no-hub outlet with a mechanical coupling.": "Вихід 2 дюйми без розтруба, з механічною муфтою."
  "23/32 in (3/4 in nominal) tongue-and-groove, 1/8 in (3 mm) gap between sheets.": "23/32 дюйма (номінально 3/4 дюйма), шпунт-паз, зазор 3 мм (1/8 дюйма) між листами."
  "23/32 in (3/4 in nominal) tongue-and-groove, with a 1/8 in gap between sheets.": "23/32 дюйма (номінально 3/4 дюйма), шпунт-паз, із зазором 1/8 дюйма між листами."
  "23/32 in (3/4 in nominal) tongue-and-groove.": "23/32 дюйма (номінально 3/4 дюйма), шпунт-паз."
  "23/32 in (3/4 in nominal) tongue-and-groove. Natural stone needs a double layer regardless of joist spacing.": "23/32 дюйма (номінально 3/4 дюйма), шпунт-паз. Для натурального каменю потрібен подвійний шар незалежно від кроку лаг."
  "25 mm board for KERDI-DRAIN-A or KERDI-LINE-A adaptor rings; 89 mm board for KERDI-DRAIN-H drain body and pipe under T, TS or TT trays (page 2).": "Плита 25 мм — для перехідних кілець KERDI-DRAIN-A чи KERDI-LINE-A; плита 89 мм — для корпусу KERDI-DRAIN-H і труби під піддонами T, TS чи TT (с. 2)."
  "3 in (75 mm) waste pipe": "Каналізаційна труба 75 мм (3 дюйми)"
  "A bathroom ceiling of moisture- and mould-resistant gypsum board, taped, finished and painted with bathroom paint.": "Стеля ванної з вологостійкого й стійкого до плісняви гіпсокартону, зі стрічкою на швах, шпаклюванням і фарбою для ванних."
  "A dry-room ceiling of gypsum board on joists or strapping, taped, finished and painted.": "Стеля сухої кімнати: гіпсокартон на балках чи обрешітці, зі стрічкою на швах, шпаклюванням і фарбою."
  "A dry-room floor on wood joists, finished with engineered wood.": "Підлога сухої кімнати на дерев'яних лагах з інженерною дошкою."
  "A hood ducted to the outside works best; make it at least as wide as the cooktop.": "Найкраще працює витяжка з виведенням назовні; вона має бути не вужчою за варильну поверхню."
  "A second layer (underlayment) at least 10 mm is required.": "Потрібен другий шар (підкладка) завтовшки щонайменше 10 мм."
  "A shower discharging 9.5 to 20 L/min needs at least a 2 in outlet pipe.": "Для душу з витратою 9,5–20 л/хв потрібна відвідна труба щонайменше 2 дюйми."
  "A shower or wet-area wall waterproofed behind the tile.": "Стіна душової чи вологої зони з гідроізоляцією під плиткою."
  "A sloped tray drained to a point drain, waterproofed and tiled.": "Піддон з ухилом до точкового трапа, гідроізольований і облицьований плиткою."
  "A standard dry-room wall of gypsum board on studs, taped, finished and painted.": "Звичайна стіна сухої кімнати: гіпсокартон на стійках, зі стрічкою на швах, шпаклюванням і фарбою."
  "A tiled bathroom floor over a wood subfloor, on cement board underlayment painted with a liquid waterproofing membrane.": "Плиткова підлога ванної на дерев'яній основі, на цементній плиті, покритій рідкою гідроізоляцією."
  "A tiled floor over a wood subfloor on an uncoupling membrane made waterproof by taping its seams and the floor-wall joints.": "Плитка на дерев'яній основі по розподільній мембрані, яка стає гідроізоляцією, коли її шви та стики підлоги зі стінами проклеєно стрічкою."
  "A tiled shower or wet-area wall of cement board covered with a bonded sheet waterproofing membrane.": "Стіна душу чи мокрої зони з цементної плити, вкрита приклеєною листовою гідроізоляційною мембраною, під плитку."
  "A tiled shower or wet-area wall of cement board painted with a liquid waterproofing membrane.": "Облицьована плиткою стіна душової чи вологої зони з цементної плити, покритої рідкою гідроізоляцією."
  "A tiled, waterproofed floor for a bathroom over a wood subfloor.": "Облицьована плиткою гідроізольована підлога ванної на дерев'яній основі."
  "A vertical stack rests on a clamp at its base, and again at least every 7.5 m.": "Вертикальний стояк спирається на хомут біля основи і далі щонайменше через кожні 7,5 м."
  "A water closet drains through 3 in pipe at least; support horizontal runs every 1.2 m.": "Унітаз відводиться трубою щонайменше 3 дюйми; горизонтальну трубу кріпіть щонайменше через 1,2 м."
