  "The thinner subfloor option is allowed in Canada only.": "Варіант із тоншою основою дозволено лише в Канаді."
  "The tray is made for one drain system: T, TS and TT trays take a KERDI-DRAIN point drain, LT and LTS trays take a KERDI-LINE linear drain.": "Піддон розрахований на один тип трапа: T, TS і TT — на точковий KERDI-DRAIN, LT і LTS — на лінійний KERDI-LINE."
