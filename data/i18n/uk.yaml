  "Floor waterproofing": "Гідроізоляція підлоги"
  "For bathroom walls outside the shower, moisture- and mould-resistant gypsum board, taped, finished and painted with bathroom paint.": "Для стін ванної поза душовою: вологостійкий і стійкий до плісняви гіпсокартон, зі стрічкою на швах, шпаклюванням і фарбою для ванних."
  "For floors where a vertical connection is impractical, e.g. a wood floor where the hole cannot be moved.": "Для підлог, де вертикальне підключення незручне, наприклад дерев'яна підлога, у якій не можна перенести отвір."
  "For the lavatory drain and the vent; the code allows 1-1/4 in at least for a lavatory.": "Для відводу умивальника й вентиляції; кодекс дозволяє для умивальника щонайменше 1¼ дюйма."
