  "Braided supply line": "Гнучка підводка в обплетенні"
  "Buy a little more than the measured length to allow for the corner cuts.": "Купуйте трохи більше за виміряну довжину, щоб вистачило на кутові підрізки."
  "Buy the board deeper than the wall so it overhangs the trim.": "Беріть дошку глибшу за стіну, щоб вона виступала над лиштвою."
  "Buy the same PEX type (A, B or C) as the fittings and tools you will use.": "Купуйте трубу того ж типу PEX (A, B чи C), що й фітинги та інструмент, які використовуватимете."
  "Buy the valve body and its trim from the same brand; a pressure-balancing valve keeps the temperature steady.": "Корпус і накладку купуйте одного бренду; змішувач з вирівнюванням тиску тримає температуру стабільною."
