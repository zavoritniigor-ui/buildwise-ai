  "Compatible drain systems": "Сумісні трапи"
  "Compatible shower bases": "Сумісні основи душової"
  "Compatible tile setting mortars": "Сумісні клейові розчини для плитки"
  "Compressive strength": "Міцність на стиск"
  "Concrete": "Бетон"
  "Concrete, cured for foot traffic": "Бетон, достатньо міцний для ходіння"
