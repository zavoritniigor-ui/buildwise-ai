# Ukrainian translations of the English texts in data/.
# The English text is the source; a changed source needs a new translation.

texts:
  "19/32 in (5/8 in nominal) tongue-and-groove, 1/8 in (3 mm) gap between sheets.": "19/32 дюйма (номінально 5/8 дюйма), шпунт-паз, зазор 3 мм (1/8 дюйма) між листами."
  "2 in (50 mm) waste pipe": "Каналізаційна труба 50 мм (2 дюйми)"
  "2 in no-hub outlet with a mechanical coupling.": "Вихід 2 дюйми без розтруба, з механічною муфтою."
  "23/32 in (3/4 in nominal) tongue-and-groove, 1/8 in (3 mm) gap between sheets.": "23/32 дюйма (номінально 3/4 дюйма), шпунт-паз, зазор 3 мм (1/8 дюйма) між листами."
  "23/32 in (3/4 in nominal) tongue-and-groove, with a 1/8 in gap between sheets.": "23/32 дюйма (номінально 3/4 дюйма), шпунт-паз, із зазором 1/8 дюйма між листами."
  "23/32 in (3/4 in nominal) tongue-and-groove.": "23/32 дюйма (номінально 3/4 дюйма), шпунт-паз."
  "23/32 in (3/4 in nominal) tongue-and-groove. Natural stone needs a double layer regardless of joist spacing.": "23/32 дюйма (номінально 3/4 дюйма), шпунт-паз. Для натурального каменю потрібен подвійний шар незалежно від кроку лаг."
  "25 mm board for KERDI-DRAIN-A or KERDI-LINE-A adaptor rings; 89 mm board for KERDI-DRAIN-H drain body and pipe under T, TS or TT trays (page 2).": "Плита 25 мм — для перехідних кілець KERDI-DRAIN-A чи KERDI-LINE-A; плита 89 мм — для корпусу KERDI-DRAIN-H і труби під піддонами T, TS чи TT (с. 2)."
  "3 in (75 mm) waste pipe": "Каналізаційна труба 75 мм (3 дюйми)"
  "A dry-room floor on wood joists, finished with engineered wood.": "Підлога сухої кімнати на дерев'яних лагах з інженерною дошкою."
  "A hood ducted to the outside works best; make it at least as wide as the cooktop.": "Найкраще працює витяжка з виведенням назовні; вона має бути не вужчою за варильну поверхню."
  "A second layer (underlayment) at least 10 mm is required.": "Потрібен другий шар (підкладка) завтовшки щонайменше 10 мм."
  "A shower or wet-area wall waterproofed behind the tile.": "Стіна душової чи вологої зони з гідроізоляцією під плиткою."
  "A sloped tray drained to a point drain, waterproofed and tiled.": "Піддон з ухилом до точкового трапа, гідроізольований і облицьований плиткою."
  "A standard dry-room wall of gypsum board on studs.": "Звичайна стіна сухої кімнати: гіпсокартон на стійках."
  "A tiled, waterproofed floor for a bathroom over a wood subfloor.": "Облицьована плиткою гідроізольована підлога ванної на дерев'яній основі."
  "A top about level with the mattress is the easiest to reach.": "Найзручніше, коли верх тумби приблизно на рівні матраца."
  "ABS or PVC": "ABS або ПВХ"
  "Acoustic underlayment": "Акустична підкладка"
  "Allowed floor framing": "Дозволені несучі елементи підлоги"
  "Allowed floor waterproofing": "Дозволена гідроізоляція підлоги"
  "Allowed mountings": "Дозволені способи монтажу"
  "Allowed shower bases": "Дозволені основи душової"
  "Allowed subfloor panel edges": "Дозволені крайки плит основи"
  "Allowed subfloors": "Дозволені основи підлоги"
  "Allowed substrates": "Дозволені основи"
  "Allowed tile materials": "Дозволені матеріали плитки"
  "Allowed uncoupling membranes": "Дозволені розділювальні мембрани"
  "Allowed uses": "Дозволене застосування"
  "Along the perimeter": "Уздовж краю"
  "Anchor tall furniture to the wall so it cannot tip over.": "Високі меблі кріпіть до стіни, щоб вони не перекинулися."
  "Area rug": "Килим"
  "Artificial plant": "Штучна рослина"
  "Attached directly to the waste line with solvent cement.": "Приєднується прямо до каналізації на клей для труб."
  "Base cabinets come in standard widths: plan the run around the sink and the appliances first.": "Нижні шафи бувають стандартних ширин: спершу сплануйте ряд довкола мийки й техніки."
  "Bath mat": "Килимок для ванної"
  "Bath towel": "Банний рушник"
  "Bathroom faucet": "Змішувач для умивальника"
  "Bathroom mirror": "Дзеркало для ванної"
  "Bathroom vanity": "Тумба для ванної"
  "Bathtub surround": "Стіни навколо ванни"
  "Bed frame": "Каркас ліжка"
  "Before buying, measure the rough-in: from the finished wall to the centre of the floor drain.": "Перед купівлею виміряйте відстань від готової стіни до центру каналізаційного отвору в підлозі."
  "Bond the membrane with ALL-SET, FAST-SET or modified thin-set.": "Мембрану клеять на ALL-SET, FAST-SET або модифікований клейовий розчин."
  "Bonded waterproofing at joints and corners": "Приклеювана гідроізоляція на стиках і кутах"
  "Bonds the membrane to the wood.": "Приклеює мембрану до дерев'яної основи."
  "Buy it for the mattress size, and check whether it needs a box spring or has slats.": "Купуйте під розмір матраца й перевірте, чи потрібна пружинна основа, чи є ламелі."
  "Buy the board deeper than the wall so it overhangs the trim.": "Беріть дошку глибшу за стіну, щоб вона виступала над лиштвою."
  "Buy the valve body and its trim from the same brand; a pressure-balancing valve keeps the temperature steady.": "Корпус і накладку купуйте одного бренду; змішувач з вирівнюванням тиску тримає температуру стабільною."
  "Cabinet pull": "Меблева ручка"
  "Canada": "Канада"
  "Canada only; 19 mm is still recommended.": "Лише в Канаді; рекомендовано все ж 19 мм."
  "Canadian option applies in": "Канадський варіант діє в"
  "Canadian option, joists at most 406 mm on centre.": "Канадський варіант: лаги не частіше ніж через 406 мм по осях."
  "Canadian option, maximum joist spacing": "Канадський варіант, найбільший крок лаг"
  "Canadian option, minimum subfloor thickness": "Канадський варіант, найменша товщина основи"
  "Canadian option, subfloor at least 16 mm.": "Канадський варіант: основа щонайменше 16 мм."
  "Cement backer unit": "Цементна плита"
  "Cement leveler, mortar bed or render coat, cured": "Цементна вирівнювальна суміш, стяжка або штукатурка, що набрали міцність"
  "Center": "По центру"
  "Ceramic tile": "Керамічна плитка"
  "Check its height against the space it has to fill.": "Звірте її висоту з місцем, яке вона має заповнити."
  "Check that it carries the TV's weight and is wider than the TV's base.": "Перевірте, що вона витримує вагу телевізора і ширша за його підставку."
  "Check that the arm and the thread match the valve's outlet.": "Перевірте, що кронштейн і різьба підходять до виходу змішувача."
  "Check the bulb base and where the switch is.": "Перевірте цоколь лампи і де розташований вимикач."
  "Check the bulb base, and that the cord reaches an outlet without crossing a walkway.": "Перевірте цоколь лампи і чи дістане шнур до розетки, не перетинаючи прохід."
  "Check the power or gas supply it needs and its cut-out size before cutting the counter.": "Перед вирізанням стільниці перевірте потрібне живлення чи газ і розмір вирізу."
  "Check the seat height against the table height.": "Звірте висоту сидіння з висотою стола."
  "Check the size matches the bed frame.": "Перевірте, що розмір збігається з каркасом ліжка."
  "Check the smallest cabinet it fits and whether it mounts under or on top of the counter.": "Перевірте мінімальну ширину шафи під неї і чи монтується вона під стільницю чи зверху."
  "Check the water and drain positions in the wall against the open back of the cabinet.": "Звірте розташування води й каналізації у стіні з відкритою задньою частиною тумби."
  "Choose an insulated steel or fibreglass door with weatherstripping; measure the rough opening and choose the hand.": "Оберіть утеплені сталеві чи склопластикові двері з ущільнювачем; виміряйте проріз і оберіть бік відчинення."
  "Choose one thin enough for the door to open over it.": "Оберіть достатньо тонкий, щоб двері відчинялися над ним."
  "Choose one with a drainage hole and a saucer to protect the floor.": "Оберіть вазон з дренажним отвором і піддоном, щоб захистити підлогу."
  "Choose one with a non-slip backing.": "Оберіть з протиковзною основою."
  "Choose the firmness for how you sleep.": "Оберіть жорсткість під свою позу сну."
  "Choose the size and the weight of the cotton.": "Оберіть розмір і щільність бавовни."
  "Choose the size for the mattress and the warmth for the room.": "Оберіть розмір під матрац і теплоту під кімнату."
  "Coat hook": "Гачок для одягу"
  "Coated glass mat water-resistant gypsum backerboard": "Вологостійка гіпсова плита з покритим склополотном"
