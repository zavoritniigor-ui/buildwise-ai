  "Takes the standard KERDI-DRAIN grates.": "Підходять стандартні решітки KERDI-DRAIN."
  "The 488 mm detail needs a thicker subfloor": "Варіант для 488 мм потребує товстішої основи"
  "The T, TS and TT trays are designed to integrate with KERDI-DRAIN.": "Піддони T, TS і TT розраховані на трап KERDI-DRAIN."
  "The drain must be made for the chosen shower base.": "Трап має підходити до вибраної основи душової."
  "The drain must belong to the waterproofing system used on the shower floor.": "Трап має належати до тієї ж системи гідроізоляції, що й підлога душової."
  "The drain outlet must match how the waste pipe arrives, below (vertical) or beside (horizontal).": "Вихід трапа має відповідати тому, як підходить труба: знизу (вертикально) чи збоку (горизонтально)."
  "The drain outlet must match the waste pipe size.": "Вихід трапа має відповідати діаметру труби."
  "The drawing legend lists joists, I-joists or trusses; the requirements text names only I-joists or floor trusses. The less restrictive reading is used.": "У підписах креслення названо лаги, двотаврові балки чи ферми, а в тексті вимог — лише двотаврові балки та ферми. Взято менш суворе прочитання."
  "The included foam channel support sets the drain elevation to the LT and LTS trays.": "Пінопластова опора каналу в комплекті виставляє висоту трапа під піддони LT і LTS."
  "The membrane may only be bonded to a substrate the manufacturer allows.": "Мембрану можна клеїти лише на дозволену виробником основу."
  "The membrane may only be used where the manufacturer allows it.": "Мембрану можна застосовувати лише там, де дозволяє виробник."
  "The membrane must be DITRA or DITRA-XL.": "Мембрана має бути DITRA або DITRA-XL."
  "The membrane must be DITRA-XL.": "Мембрана має бути DITRA-XL."
  "The membrane must be acclimated within its working temperature range.": "Мембрана має бути витримана в межах робочих температур."
  "The membrane must be bonded with a mortar the manufacturer names.": "Мембрану клеять лише на названий виробником розчин."
  "The panel may only be used where the manufacturer allows it.": "Плиту можна застосовувати лише там, де дозволяє виробник."
  "The panel must be thick enough for how it is mounted. Allowed mountings are derived from each panel's thickness.": "Плита має бути достатньо товстою для способу монтажу. Дозволені способи визначено з товщини кожної плити."
  "The shower base must be a KERDI-SHOWER tray or a mortar bed.": "Основа душової — піддон KERDI-SHOWER або стяжка."
  "The shower base must be a KERDI-SHOWER tray.": "Основа душової — піддон KERDI-SHOWER."
  "The subfloor must be plywood or OSB.": "Основа має бути з фанери або OSB."
