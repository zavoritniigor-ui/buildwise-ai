  "25 mm board for KERDI-DRAIN-A or KERDI-LINE-A adaptor rings; 89 mm board for KERDI-DRAIN-H drain body and pipe under T, TS or TT trays (page 2).": "Плита 25 мм — для перехідних кілець KERDI-DRAIN-A чи KERDI-LINE-A; плита 89 мм — для корпусу KERDI-DRAIN-H і труби під піддонами T, TS чи TT (с. 2)."
