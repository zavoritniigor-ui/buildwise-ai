  "Countertop": "Стільниця"
  "Country": "Країна"
  "Curbless shower floor": "Підлога душової без порога"
  "Curbless shower in a Montreal bathroom on a wood floor": "Душова без порога у ванній у Монреалі на дерев'яній підлозі"
  "Curbless shower over a wood or concrete subfloor (K-SHBF)": "Душова без порога на дерев'яній чи бетонній основі (K-SHBF)"
  "Curbless shower with KERDI or KERDI-BOARD walls. Recessing the floor must preserve the structure and may need a design professional.": "Душова без порога зі стінами з KERDI або KERDI-BOARD. Заглиблення підлоги не повинно послабити конструкцію; може знадобитися проєктувальник."
  "Curbless shower with the floor recessed between dimensional lumber joists, KERDI-SHOWER tray, and KERDI or DITRA-family waterproofing on the floor. Recessing must preserve the structure and may need a design professional.": "Душова без порога з підлогою, заглибленою між лагами з цільного пиломатеріалу, піддоном KERDI-SHOWER і гідроізоляцією KERDI чи з родини DITRA на підлозі. Заглиблення не повинно послабити конструкцію; може знадобитися проєктувальник."
  "Dimensional lumber, not ripped down": "Цільний пиломатеріал, не розпиляний уздовж"
  "Dining chair": "Обідній стілець"
  "Dining table": "Обідній стіл"
  "Door casing": "Лиштва"
  "Door lever": "Дверна ручка"
  "Door mat": "Килимок біля дверей"
  "Drain body material": "Матеріал корпусу трапа"
  "Drain placement": "Розташування трапа"
  "Drain system": "Тип трапа"
  "Duvet": "Ковдра"
  "Engineered I-joist": "Двотаврова клеєна балка"
  "Engineered wood flooring": "Інженерна дерев'яна підлога"
  "Entry door handleset": "Ручка для вхідних дверей"
  "Entryway storage bench": "Лавка для взуття"
  "Except the neo-angle KST965NA/BF, whose drain is off-center.": "Крім кутового KST965NA/BF, у якого трап зміщений від центру."
  "Expanded polystyrene, 60 kg/m3, measured at 10 % deformation. Keep away from hydrocarbons, esters, amines, aldehydes and long UV exposure.": "Пінополістирол 60 кг/м³, виміряно при деформації 10 %. Берегти від вуглеводнів, естерів, амінів, альдегідів і тривалого ультрафіолету."
  "Exposure 1, plugged-face plywood or OSB is recommended.": "Рекомендовано фанеру Exposure 1 з виправленою лицьовою стороною або OSB."
  "Exposure 1, plugged-face plywood or OSB, 1/8 in (3 mm) gaps; installed per page 18.": "Фанера Exposure 1 з виправленою лицьовою стороною або OSB, зазори 3 мм (1/8 дюйма); монтаж за с. 18."
  "Exterior entry door": "Вхідні двері"
  "Exterior wall": "Зовнішня стіна"
  "Fiber-cement backerboard": "Фіброцементна плита"
  "Fiber-reinforced water-resistant gypsum backerboard": "Армована волокном вологостійка гіпсова плита"
  "Fix it into studs or with anchors rated for pulling loads.": "Кріпіть до стійок або дюбелями, розрахованими на навантаження на виривання."
  "Flood test required": "Потрібне випробування заливанням водою"
  "Floor areas exposed to water need KERDI or a DITRA-family membrane.": "Ділянки підлоги, на які потрапляє вода, потребують KERDI або мембрани з родини DITRA."
  "Floor framing": "Несучі елементи підлоги"
  "Floor joists": "Лаги перекриття"
  "Floor lamp": "Торшер"
  "Floor waterproofing": "Гідроізоляція підлоги"
  "For floors where a vertical connection is impractical, e.g. a wood floor where the hole cannot be moved.": "Для підлог, де вертикальне підключення незручне, наприклад дерев'яна підлога, у якій не можна перенести отвір."
  "Framing at most 406 mm on centre.": "Несучі елементи не частіше ніж через 406 мм по осях."
  "Framing at most 488 mm on centre.": "Несучі елементи не частіше ніж через 488 мм по осях."
  "Framing at most 610 mm on centre.": "Несучі елементи не частіше ніж через 610 мм по осях."
  "Framing must be joists, I-joists, trusses.": "Несучі елементи: лаги, двотаврові балки або ферми."
  "Fully embedded in thin-set mortar on an existing wall": "Повністю вклеєна в клейовий розчин на наявній стіні"
  "Grout": "Затирка"
  "Gypsum wallboard": "Гіпсокартон"
  "Hang a heavy mirror on studs or on anchors rated for its weight.": "Важке дзеркало вішайте на стійки каркаса або на дюбелі, розраховані на його вагу."
  "Height compensation board": "Плита для вирівнювання висоти"
  "Horizontal connection to a waste pipe beside the drain": "Горизонтальне підключення до труби збоку від трапа"
  "How the panel is mounted": "Як кріпиться плита"
  "How the waste pipe reaches the drain": "Як каналізаційна труба підходить до трапа"
  "Integrated KERDI waterproofing; used to build access ramps for curbless showers.": "З вбудованою гідроізоляцією KERDI; для пандусів до душових без порога."
  "Interior dry or wet floor. DITRA does not replace movement joints; where a waterproof floor is needed, seams and floor/wall joints get KERDI-BAND.": "Внутрішня суха чи мокра підлога. DITRA не замінює деформаційних швів; де потрібна водонепроникна підлога, стики та примикання підлоги до стін закривають KERDI-BAND."
  "Interior wet-area floor": "Підлога у вологому приміщенні"
  "Interior wet-area wall": "Стіна у вологому приміщенні"
  "Intermittent-use steam shower": "Парова душова періодичного використання"
  "Joist spacing on centre": "Крок лаг по осях"
  "Joists must be dimensional lumber.": "Лаги мають бути з цільного пиломатеріалу."
  "KD2 FLK E and KD2 FLK ETH are 2 in, KD3 FLK E is 3 in. With a 3 in outlet a 6 in grate is recommended.": "KD2 FLK E і KD2 FLK ETH — 2 дюйми, KD3 FLK E — 3 дюйми. З виходом 3 дюйми рекомендована решітка 6 дюймів."
  "KD2/ABS/E is ABS, KD2/PVC/E is PVC. Kit includes flange, grate and frame, height collar, lateral ring, 4 inside and 2 outside corners, pipe and mixing valve seals.": "KD2/ABS/E — з ABS, KD2/PVC/E — з ПВХ. У комплекті фланець, решітка з рамкою, кільце регулювання висоти, кільце бічного зсуву, 4 внутрішні та 2 зовнішні кути, манжети для труби та змішувача."
  "KDH2 FLK ABS is ABS, KDH2 FLK PVC is PVC.": "KDH2 FLK ABS — з ABS, KDH2 FLK PVC — з ПВХ."
  "KERDI is bonded to the stainless steel flange with KERDI-FIX (page 8); 100 ml is included.": "KERDI приклеюють до сталевого фланця на KERDI-FIX (с. 8); 100 мл у комплекті."
  "KERDI over mortar beds; DITRA family over plywood, OSB or concrete.": "KERDI — по стяжці; родина DITRA — по фанері, OSB чи бетону."
  "KERDI-DRAIN kit when the pipe arrives from the side": "Комплект KERDI-DRAIN, коли труба підходить збоку"
  "KERDI-DRAIN kit with the pipe straight below": "Комплект KERDI-DRAIN, коли труба прямо знизу"
  "KERDI-DRAIN-H when the pipe arrives from the side": "KERDI-DRAIN-H, коли труба підходить збоку"
  "Kitchen base cabinet": "Нижня кухонна шафа"
  "Kitchen faucet": "Кухонний змішувач"
  "Kitchen sink": "Кухонна мийка"
  "Kitchen wall cabinet": "Верхня кухонна шафа"
  "Leave room behind each chair to pull it out and sit down.": "Лиште місце за кожним стільцем, щоб його відсунути й сісти."
  "Linear shower drain": "Лінійний душовий трап"
  "Magnesium board (floors only) and Schluter boards, trays and niches are also listed with conditions; they are left out until modelled. Some substrates may need a primer.": "Магнезитова плита (лише підлоги) та плити, піддони й ніші Schluter теж дозволені з умовами; їх поки не внесено. Деяким основам може знадобитися ґрунтовка."
  "Masonry (cement block, brick)": "Кладка (бетонні блоки, цегла)"
  "Match the number of holes in the sink or the counter.": "Кількість отворів має збігатися з мийкою чи стільницею."
  "Match the top to the cabinet width and its faucet holes to the faucet.": "Стільниця має відповідати ширині тумби, а отвори — змішувачу."
  "Material and substrate temperature": "Температура матеріалу та основи"
  "Mattress": "Матрац"
  "Maximum fastener spacing on ceilings": "Найбільший крок кріплення на стелі"
  "Maximum fastener spacing on walls": "Найбільший крок кріплення на стінах"
  "Maximum joist spacing": "Найбільший крок лаг"
  "Maximum service temperature": "Найвища робоча температура"
  "Maximum tile thickness": "Найбільша товщина плитки"
  "Maximum working temperature": "Найвища температура монтажу"
  "Measure both sides of the opening; casing is sold in lengths to cut at 45°.": "Виміряйте обидва боки прорізу; лиштва продається планками, які ріжуть під 45°."
  "Measure the depth so it leaves the door free to open.": "Виміряйте глибину, щоб двері вільно відчинялися."
  "Measure the distance from the sofa before choosing the screen size.": "Перед вибором діагоналі виміряйте відстань від дивана."
  "Measure the doorways and hallway it has to pass through, not only the wall it will stand against.": "Виміряйте двері й коридор, крізь які його нестимуть, а не лише стіну, біля якої він стоятиме."
  "Measure the opening's width, height and depth, and leave room for the door to open fully.": "Виміряйте ширину, висоту й глибину ніші та лиште місце, щоб двері відчинялися повністю."
  "Measure the rough opening and the wall thickness, and choose the hand from the side it opens toward.": "Виміряйте проріз і товщину стіни та оберіть праві чи ліві двері з боку, куди вони відчиняються."
