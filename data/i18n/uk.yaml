  "Standard grate assemblies adjust for 3 to 25 mm coverings; STYLE grates for 6 to 18 mm.": "Стандартні решітки регулюються під покриття 3–25 мм; решітки STYLE — під 6–18 мм."
  "Subfloor at least 16 mm.": "Основа щонайменше 16 мм."
  "Subfloor at least 19 mm.": "Основа щонайменше 19 мм."
  "Subfloor material": "Матеріал основи підлоги"
  "Subfloor panel edges": "Крайки плит основи"
