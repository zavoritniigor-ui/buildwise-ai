  "Ceramic tile": "Керамічна плитка"
  "Check that the arm and the thread match the valve's outlet.": "Перевірте, що кронштейн і різьба підходять до виходу змішувача."
  "Check the fixture's weight against the electrical box, and choose the colour temperature of the light.": "Звірте вагу світильника з монтажною коробкою та оберіть колірну температуру світла."
  "Check the smallest cabinet it fits and whether it mounts under or on top of the counter.": "Перевірте мінімальну ширину шафи під неї і чи монтується вона під стільницю чи зверху."
  "Check the water and drain positions in the wall against the open back of the cabinet.": "Звірте розташування води й каналізації у стіні з відкритою задньою частиною тумби."
  "Choose an insulated steel or fibreglass door with weatherstripping; measure the rough opening and choose the hand.": "Оберіть утеплені сталеві чи склопластикові двері з ущільнювачем; виміряйте проріз і оберіть бік відчинення."
  "Choose the airflow for the bathroom's size and duct it to the outside, never into the attic.": "Підберіть продуктивність під розмір ванної та виведіть повітропровід назовні, а не на горище."
  "Clips must hold the pipe without pinching or cutting it.": "Кліпса має тримати трубу, не перетискаючи й не ріжучи її."
  "Coated glass mat water-resistant gypsum backerboard": "Вологостійка гіпсова плита з покритим склополотном"
