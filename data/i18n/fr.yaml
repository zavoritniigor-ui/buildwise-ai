  "Braided supply line": "Conduit d'alimentation tressé"
  "Buy a little more than the measured length to allow for the corner cuts.": "Achetez un peu plus que la longueur mesurée pour les coupes d'angle."
  "Buy the board deeper than the wall so it overhangs the trim.": "Prenez une planche plus profonde que le mur pour qu'elle dépasse la moulure."
  "Buy the same PEX type (A, B or C) as the fittings and tools you will use.": "Prenez le même type de PEX (A, B ou C) que les raccords et l'outil que vous utiliserez."
  "Buy the valve body and its trim from the same brand; a pressure-balancing valve keeps the temperature steady.": "Achetez le corps et la garniture de la même marque; un robinet à pression équilibrée garde la température stable."
