  "Curbless shower with the floor recessed between dimensional lumber joists, KERDI-SHOWER tray, and KERDI or DITRA-family waterproofing on the floor. Recessing must preserve the structure and may need a design professional.": "Douche sans seuil dont le plancher est abaissé entre des solives de bois de sciage, avec receveur KERDI-SHOWER et imperméabilisation KERDI ou de la famille DITRA au sol. L'abaissement doit préserver la structure et peut exiger un professionnel de la conception."
