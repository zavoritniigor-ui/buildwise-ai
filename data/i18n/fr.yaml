# French (Canada) translations of the English texts in data/.
# The English text is the source; a changed source needs a new translation.

texts:
  "14/2 copper NMD90 suits 15 A lighting and receptacle circuits; heavier loads need 12/2 on a 20 A breaker.": "Le NMD90 14/2 en cuivre convient aux circuits d'éclairage et de prises de 15 A; les charges plus fortes exigent du 12/2 sur un disjoncteur de 20 A."
  "19/32 in (5/8 in nominal) tongue-and-groove, 1/8 in (3 mm) gap between sheets.": "19/32 po (5/8 po nominal), bouveté, joint de 3 mm (1/8 po) entre les panneaux."
  "2 in (50 mm) waste pipe": "Tuyau d'évacuation de 50 mm (2 po)"
  "2 in no-hub outlet with a mechanical coupling.": "Sortie sans emboîtement de 2 po avec raccord mécanique."
  "23/32 in (3/4 in nominal) tongue-and-groove, 1/8 in (3 mm) gap between sheets.": "23/32 po (3/4 po nominal), bouveté, joint de 3 mm (1/8 po) entre les panneaux."
  "23/32 in (3/4 in nominal) tongue-and-groove, with a 1/8 in gap between sheets.": "23/32 po (3/4 po nominal), bouveté, avec un joint de 1/8 po entre les panneaux."
  "23/32 in (3/4 in nominal) tongue-and-groove.": "23/32 po (3/4 po nominal), bouveté."
  "23/32 in (3/4 in nominal) tongue-and-groove. Natural stone needs a double layer regardless of joist spacing.": "23/32 po (3/4 po nominal), bouveté. La pierre naturelle exige une double couche, quel que soit l'espacement des solives."
  "25 mm board for KERDI-DRAIN-A or KERDI-LINE-A adaptor rings; 89 mm board for KERDI-DRAIN-H drain body and pipe under T, TS or TT trays (page 2).": "Panneau de 25 mm pour les bagues d'adaptation KERDI-DRAIN-A ou KERDI-LINE-A; panneau de 89 mm pour le corps du KERDI-DRAIN-H et le tuyau sous les receveurs T, TS ou TT (p. 2)."
  "3 in (75 mm) waste pipe": "Tuyau d'évacuation de 75 mm (3 po)"
  "A bathroom ceiling of moisture- and mould-resistant gypsum board, taped, finished and painted with bathroom paint.": "Plafond de salle de bain en panneaux de gypse résistants à l'humidité et à la moisissure, tirés à joints et peints avec une peinture pour salle de bain."
  "A dry-room ceiling of gypsum board on joists or strapping, taped, finished and painted.": "Plafond de pièce sèche : panneaux de gypse sur solives ou fourrures, tirés à joints et peints."
  "A dry-room floor on wood joists, finished with engineered wood.": "Un plancher de pièce sèche sur solives de bois, fini en bois d'ingénierie."
  "A hood ducted to the outside works best; make it at least as wide as the cooktop.": "Une hotte évacuée vers l'extérieur est la plus efficace; prenez-la au moins aussi large que la surface de cuisson."
  "A second layer (underlayment) at least 10 mm is required.": "Une deuxième couche (sous-couche) d'au moins 10 mm est requise."
  "A shower discharging 9.5 to 20 L/min needs at least a 2 in outlet pipe.": "Une douche débitant de 9,5 à 20 L/min exige un tuyau d'évacuation d'au moins 2 po."
  "A shower or wet-area wall waterproofed behind the tile.": "Un mur de douche ou de zone humide imperméabilisé derrière le carreau."
  "A sloped tray drained to a point drain, waterproofed and tiled.": "Un receveur en pente vers un drain ponctuel, imperméabilisé et carrelé."
  "A standard dry-room wall of gypsum board on studs, taped, finished and painted.": "Mur ordinaire de pièce sèche : panneaux de gypse sur montants, tirés à joints et peints."
  "A tiled bathroom floor over a wood subfloor, on cement board underlayment painted with a liquid waterproofing membrane.": "Plancher de salle de bain carrelé sur un sous-plancher de bois, sur une sous-couche de panneau de ciment enduite d'une membrane d'étanchéité liquide."
  "A tiled shower or wet-area wall of cement board painted with a liquid waterproofing membrane.": "Mur de douche ou de zone humide carrelé, en panneau de ciment enduit d'une membrane d'étanchéité liquide."
  "A tiled, waterproofed floor for a bathroom over a wood subfloor.": "Un plancher de salle de bain carrelé et imperméabilisé sur sous-plancher de bois."
  "A vertical stack rests on a clamp at its base, and again at least every 7.5 m.": "Une colonne verticale repose sur un collier à sa base, puis au moins aux 7,5 m."
  "A water closet drains through 3 in pipe at least; support horizontal runs every 1.2 m.": "Une toilette se draine par un tuyau d'au moins 3 po; supportez les parcours horizontaux aux 1,2 m."
