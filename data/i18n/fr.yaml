  "Match the boot to the vent pipe size and the roof slope.": "Choisissez-le selon le diamètre de l'évent et la pente du toit."
  "Match the circuit's amperage (15 A or 20 A) and choose tamper-resistant receptacles.": "Choisissez selon l'intensité du circuit (15 A ou 20 A) et prenez des prises inviolables."
  "Match the fitting system (crimp, clamp or expansion) to your tool.": "Choisissez le système de raccord (à sertir, à collet ou à expansion) selon votre outil."
