  "Check that the arm and the thread match the valve's outlet.": "Vérifiez que le bras et le filetage correspondent à la sortie du robinet."
  "Check the fixture's weight against the electrical box, and choose the colour temperature of the light.": "Vérifiez que la boîte électrique supporte le poids du luminaire et choisissez la température de couleur."
  "Check the smallest cabinet it fits and whether it mounts under or on top of the counter.": "Vérifiez la plus petite armoire qui le reçoit et s'il s'installe sous le comptoir ou par-dessus."
  "Check the water and drain positions in the wall against the open back of the cabinet.": "Comparez l'emplacement de l'eau et du drain dans le mur avec le dos ouvert du meuble."
  "Choose an insulated steel or fibreglass door with weatherstripping; measure the rough opening and choose the hand.": "Choisissez une porte isolée en acier ou en fibre de verre avec coupe-froid; mesurez l'ouverture brute et choisissez le sens."
  "Choose the airflow for the bathroom's size and duct it to the outside, never into the attic.": "Choisissez le débit selon la taille de la salle de bain et évacuez-le à l'extérieur, jamais dans l'entretoit."
