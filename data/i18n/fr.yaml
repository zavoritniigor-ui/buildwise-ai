  "Magnesium board (floors only) and Schluter boards, trays and niches are also listed with conditions; they are left out until modelled. Some substrates may need a primer.": "Le panneau de magnésie (planchers seulement) ainsi que les panneaux, receveurs et niches Schluter sont aussi admis sous conditions; ils seront ajoutés plus tard. Certains supports peuvent exiger un apprêt."
