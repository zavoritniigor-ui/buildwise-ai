  "KD2 FLK E and KD2 FLK ETH are 2 in, KD3 FLK E is 3 in. With a 3 in outlet a 6 in grate is recommended.": "KD2 FLK E et KD2 FLK ETH sont de 2 po, KD3 FLK E de 3 po. Avec une sortie de 3 po, une grille de 6 po est recommandée."
  "KD2/ABS/E is ABS, KD2/PVC/E is PVC. Kit includes flange, grate and frame, height collar, lateral ring, 4 inside and 2 outside corners, pipe and mixing valve seals.": "KD2/ABS/E est en ABS, KD2/PVC/E en PVC. L'ensemble comprend la bride, la grille et son cadre, le collier de hauteur, la bague latérale, 4 coins intérieurs et 2 extérieurs, et les joints de tuyau et de robinet."
