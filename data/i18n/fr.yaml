  "For floors where a vertical connection is impractical, e.g. a wood floor where the hole cannot be moved.": "Pour les planchers où un raccord vertical est peu pratique, p. ex. un plancher de bois où l'on ne peut pas déplacer l'ouverture."
  "For the lavatory drain and the vent; the code allows 1-1/4 in at least for a lavatory.": "Pour le drain du lavabo et l'évent; le code permet au moins 1-1/4 po pour un lavabo."
