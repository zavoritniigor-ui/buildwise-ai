  "How the panel is mounted": "Как крепится плита"
  "How the waste pipe reaches the drain": "Как канализационная труба подходит к трапу"
  "In Quebec it must move at least 25 L/s (53 cfm) through its duct, be switched by hand in the room and be no louder than 3.5 sones (HVI); duct it to the outside, never into the attic.": "В Квебеке вентилятор должен прогонять не менее 25 л/с (53 cfm) через свой воздуховод, включаться вручную в этой комнате и быть не громче 3,5 сона (HVI); выводите воздуховод наружу, никогда не на чердак."
