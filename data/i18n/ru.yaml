  "Expanded polystyrene, 60 kg/m3, measured at 10 % deformation. Keep away from hydrocarbons, esters, amines, aldehydes and long UV exposure.": "Пенополистирол 60 кг/м³, измерено при деформации 10 %. Беречь от углеводородов, эфиров, аминов, альдегидов и длительного ультрафиолета."
  "Exposure 1, plugged-face plywood or OSB is recommended.": "Рекомендуется фанера Exposure 1 с исправленной лицевой стороной или OSB."
