  "Waterproof bathroom floor on wood, MAPEI Mapeguard UM": "Гидроизолированный пол ванной на дереве, MAPEI Mapeguard UM"
  "Waterproof building panel": "Водонепроницаемая строительная плита"
  "Waterproof tiled wall": "Водонепроницаемая облицованная стена"
