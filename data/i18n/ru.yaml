  "For bathroom walls outside the shower, moisture- and mould-resistant gypsum board, taped, finished and painted with bathroom paint.": "Для стен ванной вне душевой: влагостойкий и устойчивый к плесени гипсокартон, с лентой на швах, шпаклёвкой и краской для ванных."
  "For floors where a vertical connection is impractical, e.g. a wood floor where the hole cannot be moved.": "Для полов, где вертикальное подключение неудобно, например деревянный пол, в котором нельзя перенести отверстие."
  "For the lavatory drain and the vent; the code allows 1-1/4 in at least for a lavatory.": "Для отвода раковины и вентиляции; кодекс допускает для раковины не менее 1¼ дюйма."
  "Framing at most 406 mm on centre.": "Несущие элементы с шагом не более 406 мм по осям."
  "Framing at most 488 mm on centre.": "Несущие элементы с шагом не более 488 мм по осям."
  "Framing at most 610 mm on centre.": "Несущие элементы с шагом не более 610 мм по осям."
  "Framing must be joists, I-joists, trusses.": "Несущие элементы: лаги, двутавровые балки или фермы."
  "Fully embedded in thin-set mortar on an existing wall": "Полностью вклеена в плиточный клей на существующей стене"
