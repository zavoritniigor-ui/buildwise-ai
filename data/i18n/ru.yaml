  "Curbless shower over a wood or concrete subfloor (K-SHBF)": "Душевая без порога на деревянном или бетонном основании (K-SHBF)"
  "Curbless shower with KERDI or KERDI-BOARD walls. Recessing the floor must preserve the structure and may need a design professional.": "Душевая без порога со стенами из KERDI или KERDI-BOARD. Углубление пола не должно ослабить конструкцию; может понадобиться проектировщик."
  "Curbless shower with the floor recessed between dimensional lumber joists, KERDI-SHOWER tray, and KERDI or DITRA-family waterproofing on the floor. Recessing must preserve the structure and may need a design professional.": "Душевая без порога с полом, углублённым между лагами из цельного пиломатериала, поддоном KERDI-SHOWER и гидроизоляцией KERDI или из семейства DITRA на полу. Углубление не должно ослабить конструкцию; может понадобиться проектировщик."
