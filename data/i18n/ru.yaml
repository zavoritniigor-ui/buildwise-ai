  "An electric baseboard needs a line-voltage thermostat rated for the heater's wattage.": "Электрическому конвектору нужен термостат на сетевое напряжение, рассчитанный на мощность конвектора."
  "Attached directly to the waste line with solvent cement.": "Присоединяется прямо к канализации на клей для труб."
  "Base cabinets come in standard widths: plan the run around the sink and the appliances first.": "Нижние шкафы бывают стандартной ширины: сначала спланируйте ряд вокруг мойки и техники."
