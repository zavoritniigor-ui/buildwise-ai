  "Takes the standard KERDI-DRAIN grates.": "Подходят стандартные решётки KERDI-DRAIN."
  "The 488 mm detail needs a thicker subfloor": "Вариант для 488 мм требует более толстого основания"
  "The T, TS and TT trays are designed to integrate with KERDI-DRAIN.": "Поддоны T, TS и TT рассчитаны на трап KERDI-DRAIN."
  "The drain must be made for the chosen shower base.": "Трап должен подходить к выбранному основанию душевой."
  "The drain must belong to the waterproofing system used on the shower floor.": "Трап должен относиться к той же системе гидроизоляции, что и пол душевой."
  "The drain outlet must match how the waste pipe arrives, below (vertical) or beside (horizontal).": "Выход трапа должен соответствовать тому, как подходит труба: снизу (вертикально) или сбоку (горизонтально)."
  "The drain outlet must match the waste pipe size.": "Выход трапа должен соответствовать диаметру трубы."
  "The drawing legend lists joists, I-joists or trusses; the requirements text names only I-joists or floor trusses. The less restrictive reading is used.": "В подписях чертежа названы лаги, двутавровые балки или фермы, а в тексте требований — только двутавровые балки и фермы. Взято менее строгое прочтение."
  "The included foam channel support sets the drain elevation to the LT and LTS trays.": "Пенопластовая опора канала в комплекте выставляет высоту трапа под поддоны LT и LTS."
  "The membrane may only be bonded to a substrate the manufacturer allows.": "Мембрану можно клеить только на допустимое производителем основание."
  "The membrane may only be used where the manufacturer allows it.": "Мембрану можно применять только там, где разрешает производитель."
  "The membrane must be DITRA or DITRA-XL.": "Мембрана должна быть DITRA или DITRA-XL."
  "The membrane must be DITRA-XL.": "Мембрана должна быть DITRA-XL."
  "The membrane must be acclimated within its working temperature range.": "Мембрана должна быть выдержана в пределах рабочих температур."
  "The membrane must be bonded with a mortar the manufacturer names.": "Мембрану клеят только на указанный производителем клей."
  "The outlet needs a backdraft damper and must sit at least 100 mm above the ground and 1.8 m from air intakes and vented soffits.": "Выход должен иметь обратный клапан, быть не ниже 100 мм над землёй и в 1,8 м от воздухозаборников и вентилируемых софитов."
  "The panel may only be used where the manufacturer allows it.": "Плиту можно применять только там, где разрешает производитель."
  "The panel must be thick enough for how it is mounted. Allowed mountings are derived from each panel's thickness.": "Плита должна быть достаточно толстой для способа монтажа. Допустимые способы определены по толщине каждой плиты."
  "The shower base must be a KERDI-SHOWER tray or a mortar bed.": "Основание душевой — поддон KERDI-SHOWER или стяжка."
  "The shower base must be a KERDI-SHOWER tray.": "Основание душевой — поддон KERDI-SHOWER."
  "The subfloor must be plywood or OSB.": "Основание должно быть из фанеры или OSB."
  "The subfloor must be plywood, OSB or concrete.": "Основание должно быть из фанеры, OSB или бетона."
  "The thinner subfloor option is allowed in Canada only.": "Вариант с более тонким основанием разрешён только в Канаде."
  "The tray is made for one drain system: T, TS and TT trays take a KERDI-DRAIN point drain, LT and LTS trays take a KERDI-LINE linear drain.": "Поддон рассчитан на один тип трапа: T, TS и TT — на точечный KERDI-DRAIN, LT и LTS — на линейный KERDI-LINE."
  "Thickness": "Толщина"
  "Thin tray with a KERDI-DRAIN point drain": "Тонкий поддон с точечным трапом KERDI-DRAIN"
  "Thin-set mortar": "Плиточный клей"
  "This detail is for ceramic or porcelain tile.": "Этот вариант — для керамической плитки или керамогранита."
  "This detail is for natural stone.": "Этот вариант — для натурального камня."
  "Through an unheated attic the duct must be insulated to RSI 0.74 (R-4.2) at least; keep it short and stretched, and support it so it cannot sag.": "На неотапливаемом чердаке воздуховод должен быть утеплён не менее чем до RSI 0,74 (R-4,2); делайте его коротким и натянутым и крепите, чтобы не провисал."
  "Tile grout": "Затирка для плитки"
  "Tile material": "Материал плитки"
  "Tile mortar": "Клеевой раствор для плитки"
  "Tile must be set on the panel with a mortar the manufacturer names.": "Плитку на плиту клеят только на указанный производителем клей."
  "Tile over DITRA on a double-layer wood floor, framing at 610 mm (D-W24-T)": "Плитка на DITRA по двухслойному деревянному основанию, несущие элементы через 610 мм (D-W24-T)"
  "Tile over DITRA on a single-layer wood subfloor, joists at 406 mm (D-W16-T)": "Плитка на DITRA по однослойному деревянному основанию, лаги через 406 мм (D-W16-T)"
  "Tile over DITRA on a single-layer wood subfloor, joists at 488 mm (D-W19-T)": "Плитка на DITRA по однослойному деревянному основанию, лаги через 488 мм (D-W19-T)"
  "Tile over DITRA-XL on a single-layer wood subfloor, framing at 610 mm (D-W24-XL-T)": "Плитка на DITRA-XL по однослойному деревянному основанию, несущие элементы через 610 мм (D-W24-XL-T)"
  "Tile over an uncoupling membrane, so the tile does not crack as the wood moves.": "Плитка на разделительной мембране, чтобы она не треснула от движения дерева."
  "Tile setting mortar": "Плиточный клей"
  "Tiled bathroom floor, DITRA on 16 mm plywood at 406 mm": "Пол ванной с плиткой, DITRA на фанере 16 мм с лагами через 406 мм"
  "Tiled floor on wood": "Плиточный пол на дереве"
  "Tiles at least 50 x 50 mm.": "Плитка не менее 50 × 50 мм."
  "Toilet": "Унитаз"
  "Toilet flange, 3 in": "Фланец для унитаза, 3 дюйма"
