  "Every entrance needs an outdoor light controlled by a wall switch inside; choose a fixture rated for wet locations.": "У каждого входа нужен наружный светильник с выключателем внутри дома; берите светильник для влажных мест."
  "Every fixture needs a trap; a lavatory takes a 1-1/4 in trap.": "Каждому прибору нужен сифон; для раковины — 1¼ дюйма."
  "Except the neo-angle KST965NA/BF, whose drain is off-center.": "Кроме углового KST965NA/BF, у которого трап смещён от центра."
