  "Hangers must not compress, cut or abrade the pipe; add one at each change of direction.": "Подвес не должен пережимать, резать или истирать трубу; ставьте его и на каждом повороте."
  "Hard-wired, interconnected alarms sound together; a combined unit also detects carbon monoxide.": "Проводные связанные между собой датчики срабатывают вместе; комбинированный датчик обнаруживает и угарный газ."
  "Height compensation board": "Плита для выравнивания высоты"
