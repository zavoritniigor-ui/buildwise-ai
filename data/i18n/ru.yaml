  "Duct joints must be sealed with mastic, metal foil duct tape or the manufacturer's sealant; cloth duct tape does not qualify.": "Стыки воздуховода нужно герметизировать мастикой, металлической фольгированной лентой или герметиком производителя; тканевая армированная лента не подходит."
