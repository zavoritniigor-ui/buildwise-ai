  "Window sill": "Подоконник"
  "With T, TS or TT trays the 89 mm KERDI-SHOWER-CB compensation board is needed around the drain body and pipe (page 2).": "С поддонами T, TS или TT вокруг корпуса трапа и трубы нужна компенсационная плита KERDI-SHOWER-CB 89 мм (с. 2)."
