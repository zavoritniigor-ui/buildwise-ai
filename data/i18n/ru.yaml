# Russian translations of the English texts in data/.
# The English text is the source; a changed source needs a new translation.

texts:
  "14/2 copper NMD90 suits 15 A lighting and receptacle circuits; heavier loads need 12/2 on a 20 A breaker.": "Медный NMD90 14/2 подходит для линий освещения и розеток на 15 А; для больших нагрузок нужен 12/2 на автомате 20 А."
  "19/32 in (5/8 in nominal) tongue-and-groove, 1/8 in (3 mm) gap between sheets.": "19/32 дюйма (номинально 5/8 дюйма), шпунт-паз, зазор 3 мм (1/8 дюйма) между листами."
  "2 in (50 mm) waste pipe": "Канализационная труба 50 мм (2 дюйма)"
  "2 in no-hub outlet with a mechanical coupling.": "Выход 2 дюйма без раструба, с механической муфтой."
  "23/32 in (3/4 in nominal) tongue-and-groove, 1/8 in (3 mm) gap between sheets.": "23/32 дюйма (номинально 3/4 дюйма), шпунт-паз, зазор 3 мм (1/8 дюйма) между листами."
  "23/32 in (3/4 in nominal) tongue-and-groove, with a 1/8 in gap between sheets.": "23/32 дюйма (номинально 3/4 дюйма), шпунт-паз, с зазором 1/8 дюйма между листами."
  "23/32 in (3/4 in nominal) tongue-and-groove.": "23/32 дюйма (номинально 3/4 дюйма), шпунт-паз."
  "23/32 in (3/4 in nominal) tongue-and-groove. Natural stone needs a double layer regardless of joist spacing.": "23/32 дюйма (номинально 3/4 дюйма), шпунт-паз. Для натурального камня нужен двойной слой независимо от шага лаг."
  "25 mm board for KERDI-DRAIN-A or KERDI-LINE-A adaptor rings; 89 mm board for KERDI-DRAIN-H drain body and pipe under T, TS or TT trays (page 2).": "Плита 25 мм — для переходных колец KERDI-DRAIN-A или KERDI-LINE-A; плита 89 мм — для корпуса KERDI-DRAIN-H и трубы под поддонами T, TS или TT (с. 2)."
  "3 in (75 mm) waste pipe": "Канализационная труба 75 мм (3 дюйма)"
  "A bathroom ceiling of moisture- and mould-resistant gypsum board, taped, finished and painted with bathroom paint.": "Потолок ванной из влагостойкого и устойчивого к плесени гипсокартона, с лентой на швах, шпаклёвкой и краской для ванных."
  "A dry-room ceiling of gypsum board on joists or strapping, taped, finished and painted.": "Потолок сухой комнаты: гипсокартон на балках или обрешётке, с лентой на швах, шпаклёвкой и краской."
  "A dry-room floor on wood joists, finished with engineered wood.": "Пол сухой комнаты на деревянных лагах с инженерной доской."
  "A hood ducted to the outside works best; make it at least as wide as the cooktop.": "Лучше всего работает вытяжка с выводом наружу; она должна быть не уже варочной поверхности."
  "A second layer (underlayment) at least 10 mm is required.": "Нужен второй слой (подложка) толщиной не менее 10 мм."
  "A shower discharging 9.5 to 20 L/min needs at least a 2 in outlet pipe.": "Для душа с расходом 9,5–20 л/мин нужна отводная труба не менее 2 дюймов."
  "A shower or wet-area wall waterproofed behind the tile.": "Стена душевой или влажной зоны с гидроизоляцией под плиткой."
  "A sloped tray drained to a point drain, waterproofed and tiled.": "Поддон с уклоном к точечному трапу, гидроизолированный и облицованный плиткой."
  "A standard dry-room wall of gypsum board on studs, taped, finished and painted.": "Обычная стена сухой комнаты: гипсокартон на стойках, с лентой на швах, шпаклёвкой и краской."
  "A tiled bathroom floor over a wood subfloor, on cement board underlayment painted with a liquid waterproofing membrane.": "Плиточный пол ванной на деревянном основании, на цементной плите, покрытой жидкой гидроизоляцией."
  "A tiled floor over a wood subfloor on an uncoupling membrane made waterproof by taping its seams and the floor-wall joints.": "Плитка на деревянном основании по разделительной мембране, которая становится гидроизоляцией, когда её швы и стыки пола со стенами проклеены лентой."
  "A tiled shower or wet-area wall of cement board covered with a bonded sheet waterproofing membrane.": "Стена душа или мокрой зоны из цементной плиты, покрытая приклеенной листовой гидроизоляционной мембраной, под плитку."
  "A tiled shower or wet-area wall of cement board painted with a liquid waterproofing membrane.": "Облицованная плиткой стена душевой или влажной зоны из цементной плиты, покрытой жидкой гидроизоляцией."
  "A tiled, waterproofed floor for a bathroom over a wood subfloor.": "Облицованный плиткой гидроизолированный пол ванной на деревянном основании."
  "A vertical stack rests on a clamp at its base, and again at least every 7.5 m.": "Вертикальный стояк опирается на хомут у основания и далее не реже чем через каждые 7,5 м."
  "A water closet drains through 3 in pipe at least; support horizontal runs every 1.2 m.": "Унитаз отводится трубой не менее 3 дюймов; горизонтальную трубу крепите не реже чем через 1,2 м."
