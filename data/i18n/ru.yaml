  "Bond the membrane with ALL-SET, FAST-SET or modified thin-set.": "Мембрану клеят на ALL-SET, FAST-SET или модифицированный плиточный клей."
  "Bonded waterproofing at joints and corners": "Приклеиваемая гидроизоляция на стыках и углах"
  "Bonds the membrane to the wood.": "Приклеивает мембрану к деревянному основанию."
  "Braided supply line": "Гибкая подводка в оплётке"
  "Buy a little more than the measured length to allow for the corner cuts.": "Покупайте немного больше измеренной длины, чтобы хватило на угловые подрезки."
  "Buy the board deeper than the wall so it overhangs the trim.": "Берите доску глубже стены, чтобы она выступала над наличником."
  "Buy the same PEX type (A, B or C) as the fittings and tools you will use.": "Покупайте трубу того же типа PEX (A, B или C), что и фитинги и инструмент, которые будете использовать."
  "Buy the valve body and its trim from the same brand; a pressure-balancing valve keeps the temperature steady.": "Корпус и накладку покупайте одного бренда; смеситель с выравниванием давления держит температуру стабильной."
