  "Check that the arm and the thread match the valve's outlet.": "Проверьте, что кронштейн и резьба подходят к выходу смесителя."
  "Check the fixture's weight against the electrical box, and choose the colour temperature of the light.": "Сверьте вес светильника с монтажной коробкой и выберите цветовую температуру света."
  "Check the smallest cabinet it fits and whether it mounts under or on top of the counter.": "Проверьте минимальную ширину шкафа под неё и монтируется ли она под столешницу или сверху."
  "Check the water and drain positions in the wall against the open back of the cabinet.": "Сверьте расположение воды и канализации в стене с открытой задней частью тумбы."
  "Choose an insulated steel or fibreglass door with weatherstripping; measure the rough opening and choose the hand.": "Выберите утеплённую стальную или стеклопластиковую дверь с уплотнителем; измерьте проём и выберите сторону открывания."
  "Clips must hold the pipe without pinching or cutting it.": "Клипса должна держать трубу, не пережимая и не режа её."
  "Coated glass mat water-resistant gypsum backerboard": "Влагостойкая гипсовая плита с покрытым стеклохолстом"
