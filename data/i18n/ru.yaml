  "Waterproofing standard": "Стандарт гидроизоляции"
  "When replacing pulls, match the hole spacing, centre to centre.": "Заменяя ручки, сверьте расстояние между отверстиями (от центра до центра)."
  "Where a 1/2 in branch leaves a 3/4 in line, buy a reducing tee.": "Где ответвление 1/2 дюйма отходит от линии 3/4 дюйма, нужен переходной тройник."
  "Where the material is used": "Где применяется материал"
