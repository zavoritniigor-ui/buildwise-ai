  "Towel bar": "Держатель для полотенца"
  "Uncoupling and waterproofing membrane, 1 m wide rolls laid edge to edge": "Разделительная и гидроизоляционная мембрана, рулоны шириной 1 м уложены встык"
  "Uncoupling and waterproofing membrane; floor and wall joints sealed with KERDI-BAND": "Разделительная и гидроизоляционная мембрана; стыки пола со стенами закрывают KERDI-BAND"
  "Uncoupling membrane": "Разделительная мембрана"
  "Uncoupling membrane, bonded with modified thin-set": "Разделительная мембрана, приклеенная модифицированным клеем"
  "United States": "США"
  "Unmodified thin-set mortar": "Немодифицированный плиточный клей"
  "Use": "Назначение"
  "Use a 3-way switch where a light is controlled from two places; a dimmer needs dimmable bulbs.": "Если светом управляют из двух мест, нужен проходной выключатель; для диммера нужны диммируемые лампы."
  "Use a thicker or wax-free seal if the flange sits below the finished floor.": "Если фланец ниже чистого пола, берите более толстое уплотнение или без воска."
  "Use cement made for ABS; never join ABS and PVC with it unless the can says so.": "Используйте клей именно для ABS; не соединяйте им ABS и ПВХ, если на банке не сказано иное."
  "Use long-sweep bends where the flow changes from vertical to horizontal.": "Где поток переходит из вертикали в горизонталь, ставьте колена большого радиуса."
  "Use tempered safety glass; a fixed panel mounts in a floor channel with a wall bracket.": "Только закалённое безопасное стекло; неподвижная панель ставится в профиль на полу с креплением к стене."
  "Vanity top with sink": "Столешница с раковиной"
  "Vapour permeance (ASTM E96)": "Паропроницаемость (ASTM E96)"
  "Vapour permeance (ASTM E96, method E)": "Паропроницаемость (ASTM E96, метод E)"
  "Vertical connection to a waste pipe below the drain": "Вертикальное подключение к трубе под трапом"
  "Wait before the water test": "Ожидание перед испытанием водой"
