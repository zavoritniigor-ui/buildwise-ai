  "Fix it into studs or with anchors rated for pulling loads.": "Крепите к стойкам или дюбелями, рассчитанными на нагрузку на вырыв."
  "Flood test required": "Требуется испытание заливом водой"
  "Floor areas exposed to water need KERDI or a DITRA-family membrane.": "Участки пола, на которые попадает вода, требуют KERDI или мембраны семейства DITRA."
