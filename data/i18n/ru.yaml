  "Interior dry or wet floor. DITRA does not replace movement joints; where a waterproof floor is needed, seams and floor/wall joints get KERDI-BAND.": "Внутренний сухой или мокрый пол. DITRA не заменяет деформационных швов; где нужен водонепроницаемый пол, стыки и примыкания пола к стенам закрывают KERDI-BAND."
